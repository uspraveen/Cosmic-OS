# Contain Alpha's memory so a runaway build (pip/venv storms hit 1.7 GB on
# 2026-09-18 and triggered a GLOBAL oom-kill that took down arbitrary
# victims) can only hurt Alpha's own slice. Beyond MemoryMax, the kernel
# kills within this cgroup and systemd restarts the alpha agent -- instead
# of an uncontained system-wide OOM picking any victim.
#
# Install: /etc/systemd/system/cosmic-alpha-agent.service.d/10-memory.conf
# then `systemctl daemon-reload && systemctl restart cosmic-alpha-agent`.

[Service]
MemoryHigh=1400M
MemoryMax=2200M
