# COSMIC services are restarted by the activity-aware restart agent
# (cosmic-restart-agent.timer + scripts/cosmic_restart_ctl.py), never
# blindly by needrestart. On 2026-09-18 a libsqlite3 security upgrade made
# needrestart bounce the entire fleet mid-Alpha-build and mid-conversation;
# this policy takes the decision away from needrestart. Staleness is still
# detected (dpkg status mtime vs service start time) and applied by the
# agent through a drain window.
$nrconf{override_rc} = {
    qr(^cosmic-) => 0,
};
