# Contain the gateway's memory. It peaked at ~2.3 GB (systemd reported
# 1711632384 + page cache pressure) on a 7.7 GB host that also runs every
# cosmic service plus Neo4j and Redis; an uncontained growth spurt becomes a
# global OOM that kills an arbitrary victim. MemoryHigh throttles before the
# hard cap; MemoryMax keeps room for the rest of the fleet.
#
# Install: /etc/systemd/system/cosmic-gateway.service.d/10-memory.conf
# then `systemctl daemon-reload && systemctl restart cosmic-gateway`.

[Service]
MemoryHigh=2600M
MemoryMax=3400M
