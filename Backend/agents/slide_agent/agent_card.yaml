agent_id: cosmic/slide-agent:1.0.0
display_name: Slide Agent
description: >
  Specialist agent for creating, editing, and cataloging presentation decks using the
  copied cosmic-slides-2 core. Supports an advanced native workflow (HTML-designed,
  fully editable PowerPoint output; default), a fast HTML/image-backed workflow, and a
  slower template-backed editable PowerPoint workflow.

intents:
  - name: slide.create
    description: Create a new slide deck using advanced (native), HTML, or template mode.
    input_schema: schemas/intents/slide.create.input.json
    output_schema: schemas/intents/slide.create.output.json
    timeout_sec: 900
    usage_hints:
      - Do not delegate a new deck request here until the user has chosen workflow=advanced, workflow=html, or workflow=template, unless the user explicitly passed workflow=auto or provided a template.
      - Advanced mode is the default — it designs each slide and converts it into a fully editable native PPTX. It works with or without a template: with a template it builds on the template's own theme and layouts; without one it plans and locks a theme itself.
      - HTML mode is fast and produces an image-backed, non-editable PPTX.
      - Template mode is slower and produces an editable PPTX by filling an uploaded template's existing layouts (or an auto-selected template from the agent templates folder).
      - The Slide Agent has internal visual sourcing tools for stock photos, web research, generated images, and bounded local Python asset generation. When the user asks for visuals inside the deck, let the Slide Agent source them internally instead of pre-generating them in the orchestrator.
      - If the user asks for generated images, custom backgrounds, or web-sourced visuals on slides, delegate directly to Slide Agent and do not route those visuals through the standalone image agent first unless the user explicitly wants separate image artifacts outside the deck.
      - If multiple templates exist and no template is specified, the agent plans the deck then selects the best matching template internally.
      - If the user uploads PDF/DOC/DOCX/PPT/PPTX source material for deck content, pass it through input_artifacts or source_artifacts; the agent delegates raw documents to docs.parse_bundle and injects parsed context before generation.
      - For large parsed source documents, the agent retrieves source pages/slides in bounded windows internally; do not inline the full PDF/doc text in the orchestrator prompt.
      - Each produced PPTX is capped at 50 slides by default. If a request needs more slides, the agent splits it into multiple deck parts and returns all produced decks.
      - "'One slide per page/slide' requests are handled by segmented source retrieval, preserving source order across split deck parts."

  - name: slide.edit
    description: Revise an existing PPTX; advanced/native and template decks regenerate through their own paths, HTML/image-backed decks through HTML mode.
    input_schema: schemas/intents/slide.edit.input.json
    output_schema: schemas/intents/slide.create.output.json
    timeout_sec: 900
    usage_hints:
      - Use this when the user uploads an existing slide deck and asks to edit it.
      - Pass source_pptx_path or attach the PPTX as an input artifact.
      - Current edit mode is regeneration, not low-level in-place shape patching.
      - The Slide Agent can internally re-source stock photos, web references, generated visuals, and local synthetic assets during regeneration. Do not pre-fetch those assets in the orchestrator unless the user explicitly asks for standalone outputs.
      - If the source deck was produced by workflow=html or is image-backed/non-editable, the agent regenerates it through the fast HTML workflow instead of treating it as an editable template.
      - For follow-up edits to a just-created non-editable HTML deck, include the produced PPTX artifact plus any prior plan/build_report artifacts if available so the agent can preserve the original subject and slide content.
      - Supporting PDF/DOC/DOCX/PPT source material can also be attached; the agent parses it through docs.parse_bundle and uses the parsed context in the regeneration brief.

  - name: slide.catalog_template
    description: Catalog a PPTX template so the template workflow can use it later.
    input_schema: schemas/intents/slide.catalog_template.input.json
    output_schema: schemas/intents/slide.catalog_template.output.json
    timeout_sec: 900
    usage_hints:
      - Use this when the user uploads a PPTX template and asks to catalog it.
      - Uploaded templates are copied into the Slide Agent templates folder before cataloging.

  - name: slide.recall_session
    description: Recall recent Slide Agent outputs for a session.
    input_schema: schemas/intents/slide.recall_session.input.json
    output_schema: schemas/intents/slide.recall_session.output.json
    timeout_sec: 30
    usage_hints:
      - Use this to find recent slide outputs or workflow/template choices from the current session.

artifact_types:
  - pptx_deck
  - pdf_preview
  - slide_contact_sheet
  - slide_build_report
  - template_catalog
  - parsed_document_bundle

policies:
  network_access: true
  writable_paths:
    - runs/artifacts
    - agents/slide_agent/templates
    - agents/slide_agent/catalogs
    - agents/slide_agent/assets
    - agents/slide_agent/runtime
    - agents/slide_agent/store
  tool_access: []
  allowed_senders:
    - cosmic/orchestrator:1.0.0
  intent_authorization:
    slide.create: [cosmic/orchestrator:1.0.0]
    slide.edit: [cosmic/orchestrator:1.0.0]
    slide.catalog_template: [cosmic/orchestrator:1.0.0]
    slide.recall_session: [cosmic/orchestrator:1.0.0]

sla:
  max_concurrency: 1
  heartbeat_interval_sec: 10
  heartbeat_ttl_sec: 30
  max_task_duration_sec: 900
  health_endpoint: /health
  retry_policy:
    max_attempts: 1
    backoff: exponential
    backoff_base_sec: 2
    backoff_max_sec: 60
    retryable_codes:
      - TIMEOUT
      - NETWORK_ERROR
      - RATE_LIMITED
    non_retryable_codes:
      - INVALID_INPUT
      - MISSING_ARTIFACT
      - NEEDS_WORKFLOW_CHOICE
      - INTERNAL_ERROR

stream_key: streams:cosmic/slide-agent:1.0.0

model_requirements:
  internal_llm:
    required: true
    provider: openai_compatible
    default_model_key: openai:gpt-5.6-terra
    env_model: SLIDE_AGENT_FIREWORKS_MODEL
    env_api_key: SLIDE_AGENT_FIREWORKS_API_KEY
    env_base_url: SLIDE_AGENT_FIREWORKS_BASE_URL
    fallback:
      default_model_key: fireworks:accounts/fireworks/models/glm-5p3-flash
    notes:
      - Deck planning and per-slide vision validation are heavy work; with an OpenAI
        key the agent runs GPT-5.6 Terra at xhigh reasoning effort.
      - Without an OpenAI key the agent keeps the Fireworks Qwen fallback
        (accounts/fireworks/models/glm-5p3-flash) unchanged.

version_info:
  semver: 1.0.0
  released_at: "2026-04-11"
  deprecated_at: null
  remove_after: null
  changelog: CHANGELOG.md
