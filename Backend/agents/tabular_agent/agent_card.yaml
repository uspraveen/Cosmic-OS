agent_id: cosmic/tabular-agent:1.0.0
display_name: Tabular Spreadsheet Agent
description: >
  Anything to do with spreadsheets, this is the specialist to use. Parses, queries, creates, edits,
  exports, and converts XLSX, CSV, TSV, and XLSB files. Beyond general tabular operations, the agent
  has deep financial analysis skills that it activates on demand: three-statement analysis (P&L, Balance
  Sheet, Cash Flow), financial ratio analysis (liquidity, profitability, leverage, Altman Z-Score),
  variance analysis (budget vs actual, flexible budget), revenue & SaaS analytics (MRR/ARR waterfall,
  cohort retention, NRR/GRR, LTV/CAC), working capital (DSO/DPO/DIO, cash conversion cycle, AR/AP
  aging), margin bridge & PVM decomposition, expense & OpEx analysis (run-rate, cost per head, vendor
  concentration, SG&A leverage), financial consolidation (intercompany elimination, currency translation,
  NCI), and FP&A planning (forecasting, scenario analysis). For complex goals, the agent plans multi-step
  analyses and runs a verification pass on all computed results before reporting.

intents:
  - name: tabular.parse_bundle
    description: Parse one or more spreadsheet artifacts into canonical tabular bundles.
    timeout_sec: 300
    usage_hints:
      - Use this first for uploaded spreadsheets so later tabular work can operate on the canonical workbook bundle instead of raw files.
      - Prefer parsing once and reusing the resulting bundle for browse, schema, preview, query, export, and reasoning steps.
  - name: tabular.browse_workbook
    description: List workbooks and handles for a tabular bundle.
    timeout_sec: 60
    usage_hints:
      - Start with bundle/workbook discovery when you need to orient on what sheets exist.
  - name: tabular.schema_sheet
    description: Return sheet schema entries from sheet_catalog.json.
    timeout_sec: 60
    usage_hints:
      - Check schema before making strong claims about headers, units, formulas, or column meaning.
      - Treat catalog/schema output as the source of truth for structure; do not invent cell addresses.
  - name: tabular.preview_sheet
    description: Return bounded sheet preview markdown.
    timeout_sec: 60
    usage_hints:
      - Use preview when layout or header interpretation is still unclear after schema inspection.
  - name: tabular.query_workbook
    description: Run a read-only SELECT against the DuckDB bundle.
    timeout_sec: 120
    usage_hints:
      - Prefer deterministic query_workbook for filtering, grouping, joins, and exact numeric answers.
  - name: tabular.export_result
    description: Export a SELECT result to CSV or Parquet under the bundle exports folder.
    timeout_sec: 120
    usage_hints:
      - Use export_result for derived query outputs, not for exporting an existing sheet unchanged.
  - name: tabular.export_sheet
    description: Export one existing parsed sheet to CSV, XLSX, or Parquet without writing SQL.
    timeout_sec: 120
    usage_hints:
      - Use export_sheet when the user wants the same parsed sheet/workbook in another file format.
  - name: tabular.create_sheet
    description: Create an empty derived sheet (Parquet + DuckDB view) inside an existing bundle.
    timeout_sec: 60
    usage_hints:
      - Use create_sheet to add a new empty tab inside an existing parsed workbook bundle.
  - name: tabular.create_workbook
    description: Create a brand-new workbook bundle from structured rows/sheets and emit a downloadable .xlsx.
    timeout_sec: 120
    usage_hints:
      - Use create_workbook when the spreadsheet does not already exist as an uploaded or parsed bundle.
  - name: tabular.reason_workbook
    description: >
      Agentic multi-step reasoning over a parsed workbook with financial analysis skills. The agent
      plans its approach, activates domain-specific skills (formulas, SQL patterns, benchmarks), executes
      queries, and verifies results before summarizing. Handles complex financial analysis that requires
      multiple steps: ratio analysis, variance decomposition, margin bridges, working capital metrics,
      revenue analytics, consolidation, and more.
    timeout_sec: 240
    usage_hints:
      - Use reason_workbook for one delegated spreadsheet goal when composing many granular steps yourself would be clumsy.
      - Prefer schema, preview, query, and export tools directly when you already know the exact deterministic operation.
      - Use for financial analysis tasks — variance (budget vs actual), ratio analysis (liquidity, profitability, leverage, Altman Z-Score), three-statement linkage (P&L + BS + CF).
      - Use for SaaS/revenue analytics — MRR/ARR waterfall, cohort retention, NRR/GRR, LTV/CAC, Rule of 40, churn decomposition.
      - Use for working capital analysis — DSO, DPO, DIO, cash conversion cycle, AR/AP/inventory aging, FCF conversion.
      - Use for margin and profitability — PVM (Price-Volume-Mix) decomposition, gross/operating margin bridges, segment profitability, contribution margin.
      - Use for expense/OpEx analysis — run-rate calculation, cost per head, vendor concentration, fixed vs variable decomposition, SG&A leverage.
      - Use for multi-entity consolidation — intercompany elimination, currency translation, CTA, NCI/minority interest, segment reporting.
      - Use for FP&A — forecasting, scenario/sensitivity analysis, budget planning, what-if modeling.

artifact_types:
  - tabular_workbook_bundle
  - parquet_table
  - duckdb_bundle

policies:
  network_access: true
  writable_paths:
    - runs/artifacts
    - agents/tabular_agent/store
    - agents/tabular_agent/runtime
  tool_access: []
  allowed_senders:
    - cosmic/orchestrator:1.0.0
    - cosmic/gateway:1.0.0
  intent_authorization:
    tabular.parse_bundle: [cosmic/orchestrator:1.0.0, cosmic/gateway:1.0.0]
    tabular.browse_workbook: [cosmic/orchestrator:1.0.0, cosmic/gateway:1.0.0]
    tabular.schema_sheet: [cosmic/orchestrator:1.0.0, cosmic/gateway:1.0.0]
    tabular.preview_sheet: [cosmic/orchestrator:1.0.0, cosmic/gateway:1.0.0]
    tabular.query_workbook: [cosmic/orchestrator:1.0.0, cosmic/gateway:1.0.0]
    tabular.export_result: [cosmic/orchestrator:1.0.0, cosmic/gateway:1.0.0]
    tabular.export_sheet: [cosmic/orchestrator:1.0.0, cosmic/gateway:1.0.0]
    tabular.create_sheet: [cosmic/orchestrator:1.0.0, cosmic/gateway:1.0.0]
    tabular.create_workbook: [cosmic/orchestrator:1.0.0, cosmic/gateway:1.0.0]
    tabular.reason_workbook: [cosmic/orchestrator:1.0.0, cosmic/gateway:1.0.0]

sla:
  max_concurrency: 1
  heartbeat_interval_sec: 10
  heartbeat_ttl_sec: 30
  max_task_duration_sec: 420
  health_endpoint: /health
  retry_policy:
    max_attempts: 2
    backoff: exponential
    backoff_base_sec: 2
    backoff_max_sec: 30

stream_key: streams:cosmic/tabular-agent:1.0.0

version_info:
  semver: 1.0.0
  released_at: 2026-03-22
