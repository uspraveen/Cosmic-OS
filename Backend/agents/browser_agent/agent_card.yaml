agent_id: cosmic/browser-agent:1.0.0
display_name: Browser Agent
description: >
  Vision-based browser automation specialist built on cosmic-browser-use. Drives a
  real (headless) Chromium to accomplish web goals: search, navigate, log in with
  vault-provisioned credentials, extract data (including parallel multi-page
  extraction), and report a final answer with full run artifacts.

intents:
  - name: browser.run
    description: Run one autonomous browser session for a single goal.
    input_schema: schemas/intents/browser.run.input.json
    output_schema: schemas/intents/browser.run.output.json
    timeout_sec: 900
    usage_hints:
      - One goal per run; phrase it as a complete self-contained instruction for a web agent ("Get the engineering job openings and salaries from the World Labs careers page").
      - For a read-only page that needs no login or interaction, prefer the Firecrawl specialist's scrape/extract intents instead — they are much faster and cheaper than driving a full browser. Reach for this intent when the page needs an authenticated session or JS-heavy interaction (clicking, filling forms, multi-step navigation).
      - If the site requires login and the user's vault has an entry, call vault_lookup first and pass the credential_ref this tool returns; the orchestrator injects the resolved secret securely (the model never sees it).
      - If the run ends with status=credentials_needed, provision credentials via the credential request flow and delegate browser.run again with the new credential_ref.
      - Use memory_mode=auto to reuse previously learned site workflows, learn to index a successful run for later recall. Keep off for one-off tasks.
      - Browser runs can take several minutes. A first response of in_progress is normal — poll again with the same idempotency key.
      - Before starting a new run, consider browser.recall_session if the user's request references prior browser work this session (e.g. "what did we find", "check that page again") — it's a cheap lookup with no browser launch.
      - A run that reaches max_steps no longer stops dead: it asks to continue, and is granted more steps only if recent steps made verified progress (bounded by max_step_extensions/max_total_steps). If it still ends with stop_reason=step_budget_exhausted, the answer is partial - re-run with a narrower goal naming only what is still missing rather than repeating the same broad goal. step_extensions records every such decision.
      - Size max_steps to the task: a single page lookup needs ~15, a multi-page comparison or anything that must open several records needs 60+. Under-budgeting is the most common cause of a partial answer.
      - The user can pause a live run from the desktop and drive the browser themselves, then hand it back. Each handover is recorded in `takeovers` with what changed (page moved, sites signed into, their own note). Page state after a takeover is the user's work: read the summary rather than assuming the agent did it, and never re-run what they just did by hand. Time spent paused is excluded from the run's own budgets.
      - The result may include artifacts: long extracts (tables, article bodies, transcripts) the run offloaded to files rather than inlining. When answer summarizes or points at one of these, read the file with artifact_read using its path before answering from the summary alone — the answer on its own can be just a pointer.
      - The result may include user_interrupts: every question the agent asked the user mid-run (OTP, bot check, ambiguous form choice) and how it was resolved (answered/skipped/timeout). You are never in that loop in real time — it's resolved directly between this agent and the desktop — but use it to explain an incomplete/failed status or follow up if the user skipped something needed. Secret answers (password/verification_code) are never included.

  - name: browser.recall_session
    description: Recall previous browser.run work stored in the agent's session ledger. No browser is launched.
    input_schema: schemas/intents/browser.recall_session.input.json
    output_schema: schemas/intents/browser.recall_session.output.json
    timeout_sec: 30
    usage_hints:
      - Use this when the user references prior browser work — "what did we find", "check that page again", a site you likely already visited this session — before deciding a fresh browser.run is needed.
      - Not a default preamble to every browser.run: for a clearly new goal, just run it. This is for the ambiguous/repeat case, the same way alpha.recall_project is used before alpha.execute only when project identity is ambiguous.
      - Pass query to filter by keyword (matched against goal, summary, and target domain); omit it to get the most recent runs for the session.

artifact_types:
  - browser_run_dir

policies:
  network_access: true
  writable_paths:
    - runs
    - agents/browser_agent
    - agents/browser_agent/store
  tool_access: []
  allowed_senders:
    - cosmic/orchestrator:1.0.0
  intent_authorization:
    browser.run: [cosmic/orchestrator:1.0.0]
    browser.recall_session: [cosmic/orchestrator:1.0.0]

sla:
  max_concurrency: 1
  heartbeat_interval_sec: 10
  heartbeat_ttl_sec: 30
  max_task_duration_sec: 900
  health_endpoint: /health
  retry_policy:
    max_attempts: 1
    backoff: exponential
    backoff_base_sec: 2
    backoff_max_sec: 60
    retryable_codes:
      - TIMEOUT
      - NETWORK_ERROR
      - RATE_LIMITED
    non_retryable_codes:
      - INVALID_INPUT
      - BROWSER_RUN_FAILED
      - INTERNAL_ERROR

stream_key: streams:cosmic/browser-agent:1.0.0

model_requirements:
  internal_llm:
    required: true
    provider: openai_compatible
    default_model_key: fireworks:accounts/fireworks/models/glm-5p3-flash
    env_model: BROWSER_AGENT_MODEL
    env_api_key: FIREWORKS_API_KEY
    env_base_url: FIREWORKS_BASE_URL
    notes:
      - The browser agent runs its own base brain (Fireworks GLM) and escalation
        brain (xAI grok) internally; orchestrator delegation carries only the goal.

version_info:
  semver: 1.0.0
  released_at: "2026-09-08"
  deprecated_at: null
  remove_after: null
  changelog: CHANGELOG.md
