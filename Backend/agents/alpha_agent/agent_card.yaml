agent_id: cosmic/alpha-agent:1.0.0
display_name: Alpha Agent
description: >
  Alpha-stage project operator for COSMIC. It prepares isolated project
  workspaces and executes high-level software, deployment, and
  capability-bootstrap tasks through the selected Codex or Cursor CLI harness
  when the desktop agent provider settings are authenticated.

intents:
  - name: alpha.execute
    description: Execute or continue a high-level Alpha project task with the selected CLI harness.
    input_schema: schemas/intents/alpha.execute.input.json
    output_schema: schemas/intents/alpha.execute.output.json
    timeout_sec: 14400
    usage_hints:
      - "Treat Alpha as COSMIC's VM project operator: a Codex/Cursor/Claude Code CLI-style agent that can work in a real workspace, edit files, run terminal commands, install dependencies, execute tests, operate repos, produce artifacts, and perform deployment-oriented workflows when the selected CLI provider is authenticated."
      - Use this for high-level project work that requires capabilities outside the pre-packaged COSMIC specialists, especially when the task needs arbitrary CLI/tool use, repo-level code changes, dependency setup, filesystem work, long-running engineering loops, or VM-side deployment steps.
      - Good fits include building and hosting a website, cloning a repo and extending it, creating a new app, wiring an unfamiliar toolchain, running a research/code workflow, fine-tuning or training experiments, browser/screenshot automation from the VM, or completing a multi-step engineering task end-to-end.
      - Pass a high-level goal with success criteria, relevant constraints, desired outputs, deployment target, artifact expectations, and any known repo/project/deployment references; do not decompose into tiny shell commands unless the user explicitly requires exact commands.
      - For uploaded PDFs, parsed document bundles, images, large logs, generated HTML, repo archives, screenshots, or other bulky context, pass artifact_ids or input_artifacts and concise instructions; do not paste full parsed documents or full files into goal. Alpha can inspect staged files directly in its workspace.
      - When a relevant document has a bundle_id/parse_bundle_id, pass the original artifact_id or input_artifact descriptor instead of only mentioning the bundle id in prose; the Alpha handoff will stage parsed bundle files such as document.md, chunk_index.json, document.json, and manifest.json into the workspace.
      - Prefer normal COSMIC specialists for narrow packaged capabilities such as email, calendar, slides, docs parsing, tabular analysis, image generation, diagrams, X search, or Firecrawl extraction when those specialists directly satisfy the request.
      - Use Alpha when a packaged specialist is insufficient, when several tools must be combined inside a project workspace, or when the user asks for something a human engineer would normally do through a coding CLI/terminal agent.
      - Use prepare_only=true only for diagnostics or when the user explicitly asks to create/recall the workspace without execution.
      - Do not delegate destructive production changes, credential changes, or irreversible infrastructure mutations here unless the user goal explicitly asks for them and the target project/context is clear.
      - Pass project_ref when the user is referring to an existing Alpha project, repo URL, deployment URL, local path, prior task, prior artifact, or project alias; call alpha.recall_project first when identity is ambiguous.
      - Expect Alpha to communicate progress back through task events and final artifacts; if Alpha reports ambiguity or missing auth/tooling, treat that like a human engineer asking for clarification or setup.

  - name: alpha.recall_project
    description: Recall and score Alpha projects by id, alias, repo URL, deployment URL, local path, prior task, artifact, session, or natural-language project/task reference.
    input_schema: schemas/intents/alpha.recall_project.input.json
    output_schema: schemas/intents/alpha.recall_project.output.json
    timeout_sec: 30
    usage_hints:
      - Use this when the user refers to a previous Alpha project, repo, deployment, artifact, task, workspace, or asks what Alpha has worked on.
      - Prefer this before alpha.execute when project identity is ambiguous; pass the strongest reference the orchestrator can recover from memory, session history, artifacts, specialist receipts, deployment URLs, repo URLs, or user wording.
      - Recall searches project metadata and task history, returns ranked candidates, and marks ambiguous matches so the orchestrator can choose from memory or ask the user.
      - If recall returns multiple plausible projects or no clear project, the orchestrator should resolve with memory/context or ask the user before continuing with alpha.execute.

artifact_types:
  - alpha_project_workspace
  - alpha_project_report
  - alpha_task_log
  - alpha_container_summary
  - alpha_codex_report
  - alpha_cursor_report

policies:
  network_access: true
  writable_paths:
    - runs/artifacts
    - agents/alpha_agent/runtime
    - agents/alpha_agent/store
    - /var/lib/cosmic/alpha
  tool_access:
    - docker_workspace_run
    - codex_exec
    - cursor_agent
  allowed_senders:
    - cosmic/orchestrator:1.0.0
  intent_authorization:
    alpha.execute: [cosmic/orchestrator:1.0.0]
    alpha.recall_project: [cosmic/orchestrator:1.0.0]

sandbox:
  boundary: alpha_workspace_cli_sandbox
  workspace_root_env: ALPHA_WORKSPACE_ROOT
  codex_home_env: ALPHA_CODEX_HOME
  cursor_home_env: ALPHA_CURSOR_HOME
  codex_sandbox_default: danger-full-access
  docker_socket_mount_default: false
  host_deployment_broker_required: false

safety:
  alpha_warning: true
  service_enabled_by_env: ALPHA_AGENT_ENABLED
  require_cli_auth_from_desktop_settings: true
  execution_scope: selected_cli_in_alpha_workspace
  audit_all_container_runs: true

sla:
  max_concurrency: 1
  heartbeat_interval_sec: 10
  heartbeat_ttl_sec: 30
  max_task_duration_sec: 14400
  health_endpoint: /health
  retry_policy:
    max_attempts: 1
    backoff: exponential
    backoff_base_sec: 2
    backoff_max_sec: 60
    retryable_codes:
      - TIMEOUT
      - DOCKER_UNAVAILABLE
      - WORKSPACE_BUSY
    non_retryable_codes:
      - INVALID_INPUT
      - PROJECT_NOT_FOUND
      - UNSUPPORTED_OPERATION
      - INTERNAL_ERROR

stream_key: streams:cosmic/alpha-agent:1.0.0

version_info:
  semver: 1.0.0
  released_at: "2026-05-02"
  deprecated_at: null
  remove_after: null
  changelog: CHANGELOG.md
