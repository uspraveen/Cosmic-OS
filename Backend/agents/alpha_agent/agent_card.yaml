agent_id: cosmic/alpha-agent:1.0.0
display_name: Alpha Agent
description: >
  Alpha-stage project operator for COSMIC. It prepares isolated project
  workspaces and executes high-level software, deployment, and
  capability-bootstrap tasks through the selected Codex or Cursor CLI harness
  when the desktop agent provider settings are authenticated.

intents:
  - name: alpha.execute
    description: Execute or continue a high-level Alpha project task with the selected CLI harness.
    input_schema: schemas/intents/alpha.execute.input.json
    output_schema: schemas/intents/alpha.execute.output.json
    timeout_sec: 3600
    usage_hints:
      - Use this only for high-level project work that requires capabilities outside the pre-packaged COSMIC specialists.
      - Good fits include building or hosting a website, cloning a repo and extending it, creating a new app, running a research/code workflow, or completing a multi-step engineering task.
      - Use prepare_only=true only for diagnostics or when the user explicitly asks to create/recall the workspace without execution.
      - Do not delegate destructive production changes here unless the user goal explicitly asks for production changes.
      - Pass project_ref when the user is referring to an existing Alpha project, repo URL, deployment URL, local path, or prior project alias.

  - name: alpha.recall_project
    description: Recall Alpha projects by id, alias, repo URL, deployment URL, local path, or session.
    input_schema: schemas/intents/alpha.recall_project.input.json
    output_schema: schemas/intents/alpha.recall_project.output.json
    timeout_sec: 30
    usage_hints:
      - Use this when the user refers to a previous Alpha project or asks what Alpha has worked on.
      - Prefer this before alpha.execute when project identity is ambiguous.

artifact_types:
  - alpha_project_workspace
  - alpha_project_report
  - alpha_task_log
  - alpha_container_summary
  - alpha_codex_report
  - alpha_cursor_report

policies:
  network_access: true
  writable_paths:
    - runs/artifacts
    - agents/alpha_agent/runtime
    - agents/alpha_agent/store
    - /var/lib/cosmic/alpha
  tool_access:
    - docker_workspace_run
    - codex_exec
    - cursor_agent
  allowed_senders:
    - cosmic/orchestrator:1.0.0
  intent_authorization:
    alpha.execute: [cosmic/orchestrator:1.0.0]
    alpha.recall_project: [cosmic/orchestrator:1.0.0]

sandbox:
  boundary: alpha_workspace_cli_sandbox
  workspace_root_env: ALPHA_WORKSPACE_ROOT
  codex_home_env: ALPHA_CODEX_HOME
  cursor_home_env: ALPHA_CURSOR_HOME
  codex_sandbox_default: danger-full-access
  docker_socket_mount_default: false
  host_deployment_broker_required: true

safety:
  alpha_warning: true
  service_enabled_by_env: ALPHA_AGENT_ENABLED
  require_cli_auth_from_desktop_settings: true
  execution_scope: selected_cli_in_alpha_workspace
  audit_all_container_runs: true

sla:
  max_concurrency: 1
  heartbeat_interval_sec: 10
  heartbeat_ttl_sec: 30
  max_task_duration_sec: 3600
  health_endpoint: /health
  retry_policy:
    max_attempts: 1
    backoff: exponential
    backoff_base_sec: 2
    backoff_max_sec: 60
    retryable_codes:
      - TIMEOUT
      - DOCKER_UNAVAILABLE
      - WORKSPACE_BUSY
    non_retryable_codes:
      - INVALID_INPUT
      - PROJECT_NOT_FOUND
      - UNSUPPORTED_OPERATION
      - INTERNAL_ERROR

stream_key: streams:cosmic/alpha-agent:1.0.0

version_info:
  semver: 1.0.0
  released_at: "2026-05-02"
  deprecated_at: null
  remove_after: null
  changelog: CHANGELOG.md
