agent_id: cosmic/docs-parser-agent:1.0.0
display_name: Docs Parser Agent
description: >
  Specialist agent for parsing uploaded document bundles into durable structured artifacts.
  It converts PDFs, DOCX, and PPTX inputs into canonical parsed bundles with markdown, lossless
  JSON, and chunk indexes that the rest of COSMIC can navigate selectively.

intents:
  - name: docs.parse_bundle
    description: Parse one or more uploaded document artifacts into canonical parsed bundles and chunk indexes.
    input_schema: schemas/intents/docs.parse_bundle.input.json
    output_schema: schemas/intents/docs.parse_bundle.output.json
    timeout_sec: 240
  - name: docs.browse_bundle
    description: Browse parsed-bundle indexes such as documents, sections, pages, slides, chunks, tables, figures, or asset metadata without loading full content.
    input_schema: schemas/intents/docs.browse_bundle.input.json
    output_schema: schemas/intents/docs.browse_bundle.output.json
    timeout_sec: 60
    usage_hints:
      - Browse first when you need orientation on document structure, figures, or assets before broader reads.
  - name: docs.search_bundle
    description: Search parsed sections or chunks inside a previously created bundle and return the strongest matching excerpts.
    input_schema: schemas/intents/docs.search_bundle.input.json
    output_schema: schemas/intents/docs.search_bundle.output.json
    timeout_sec: 60
    usage_hints:
      - Use search before longer reads when you need targeted retrieval from a parsed document bundle.
  - name: docs.read_bundle
    description: Read a parsed bundle by document window, section, page range, slide range, chunk identifiers, or markdown anchor.
    input_schema: schemas/intents/docs.read_bundle.input.json
    output_schema: schemas/intents/docs.read_bundle.output.json
    timeout_sec: 60
    usage_hints:
      - Canonical parsed content lives on document.md; walk it in bounded reads instead of pretending the whole file is already in context.
      - Identify doc_id first in multi-document bundles before broader reads.
  - name: docs.fetch_asset
    description: Fetch exact parsed sidecar asset metadata and lightweight text content for a figure, table, or generated page asset.
    input_schema: schemas/intents/docs.fetch_asset.input.json
    output_schema: schemas/intents/docs.fetch_asset.output.json
    timeout_sec: 60
    usage_hints:
      - Fetch asset metadata when you need the exact figure, table, or generated page reference from a parsed bundle.
  - name: docs.reinspect_asset
    description: Reinspect an exact parsed image asset such as a figure, chart, page image, or slide image using the hosted visual pipeline.
    input_schema: schemas/intents/docs.reinspect_asset.input.json
    output_schema: schemas/intents/docs.reinspect_asset.output.json
    timeout_sec: 90
    usage_hints:
      - Use reinspect_asset when visual certainty matters; do not claim visual inspection from fetch_asset alone.

artifact_types:
  - parsed_document_bundle
  - parsed_markdown
  - parsed_json
  - chunk_index
  - page_image
  - figure_image
  - table_extract

policies:
  network_access: true
  writable_paths:
    - runs/artifacts
    - agents/docs_parser/store
    - agents/docs_parser/runtime
  tool_access: []
  allowed_senders:
    - cosmic/orchestrator:1.0.0
    - cosmic/gateway:1.0.0
    - cosmic/email-agent:1.0.0
  intent_authorization:
    docs.parse_bundle: [cosmic/orchestrator:1.0.0, cosmic/gateway:1.0.0, cosmic/email-agent:1.0.0]
    docs.browse_bundle: [cosmic/orchestrator:1.0.0]
    docs.search_bundle: [cosmic/orchestrator:1.0.0]
    docs.read_bundle: [cosmic/orchestrator:1.0.0]
    docs.fetch_asset: [cosmic/orchestrator:1.0.0]
    docs.reinspect_asset: [cosmic/orchestrator:1.0.0]

sla:
  max_concurrency: 1
  heartbeat_interval_sec: 10
  heartbeat_ttl_sec: 30
  max_task_duration_sec: 240
  health_endpoint: /health
  retry_policy:
    max_attempts: 2
    backoff: exponential
    backoff_base_sec: 2
    backoff_max_sec: 30
    retryable_codes:
      - TIMEOUT
      - PARSER_UNAVAILABLE
      - PARSE_FAILED
    non_retryable_codes:
      - INVALID_INPUT
      - UNSUPPORTED_ARTIFACT
      - MISSING_ARTIFACT
      - SCHEMA_VIOLATION
      - INTERNAL_ERROR

stream_key: streams:cosmic/docs-parser-agent:1.0.0

version_info:
  semver: 1.0.0
  released_at: 2026-03-19
  deprecated_at: null
  remove_after: null
  changelog: CHANGELOG.md
