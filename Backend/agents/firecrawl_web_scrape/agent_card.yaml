agent_id: cosmic/firecrawl-web-scrape-agent:1.0.0
display_name: Firecrawl Web Scrape Agent
description: >
  Specialist agent for high-fidelity page scraping, structured extraction, live web
  search, and Alexandria catalogue data through Firecrawl. It handles single-page
  scrape requests, multi-page extraction jobs, web/news/image search with Alexandria
  tool discovery, execution of Alexandria provider tools (typed records from official
  data sources), and recall of prior Firecrawl work captured in the agent's private
  session ledger.

intents:
  - name: firecrawl.scrape
    description: Scrape a single URL into clean content formats such as markdown, html, links, images, or a full-page screenshot. Use formats:["screenshot"] to capture image-locked tables/charts as an image artifact the vision model can read (full-page by default), pass a direct image URL to read that image, and parsers (e.g. ["pdf"]) to force OCR on PDF/scanned sources.
    input_schema: schemas/intents/firecrawl.scrape.input.json
    output_schema: schemas/intents/firecrawl.scrape.output.json
    timeout_sec: 120
    usage_hints:
      - Prefer this over the browser agent (browser.run) for any read-only page that needs no login or interaction — it's much faster and cheaper than driving a full browser. Use the browser agent instead when the page needs an authenticated session or JS-heavy interaction (clicking, filling forms, multi-step navigation).
      - Discovery for an acting task (find-then-act) — when a goal needs the browser agent to act on a page it first has to find, scrape here to resolve the exact URL, then delegate browser.run with that URL as initial_url and the page named in the goal. Locating pages by in-browser traversal costs browser minutes; a scrape here is seconds. Only for pages viewable without the user's session — logged-in pages must be found by the browser agent itself.
      - When the data you need is rendered as an image, read it visually one of two ways - scrape the direct image URL (e.g. a .png chart/table), or request formats:["screenshot"] which is captured full-page by default so content below the fold is included. Both surface an image artifact for the vision model.
      - A direct image URL is fetched as an image artifact even though Firecrawl cannot parse binary images; prefer it when you know the exact image URL.
      - Set screenshot_full_page:false only if you specifically want the top viewport instead of the whole page.
      - Pass parsers (e.g. ["pdf"] or [{"type":"pdf"}]) for PDF or scanned-document URLs whose text is missing or garbled.

  - name: firecrawl.extract
    description: Run Firecrawl extraction over one or more URLs and return structured data with optional sources. Text/DOM based; returns null for absent fields and never fabricates. For image-locked numbers, use firecrawl.scrape with formats:["screenshot"] instead.
    input_schema: schemas/intents/firecrawl.extract.input.json
    output_schema: schemas/intents/firecrawl.extract.output.json
    timeout_sec: 180
    usage_hints:
      - Extraction cannot read numbers that exist only inside an image; for those use firecrawl.scrape formats:["screenshot"] and let the vision model read it.
      - Absent values come back as null; cross-check surprising numbers against page text or the screenshot.
      - Pass parsers (e.g. ["pdf"]) for PDF or scanned-document sources.

  - name: firecrawl.agent
    description: Run an autonomous Firecrawl AI agent that searches, navigates, and extracts data from the web given a natural-language prompt.
    input_schema: schemas/intents/firecrawl.agent.input.json
    output_schema: schemas/intents/firecrawl.agent.output.json
    timeout_sec: 300
    usage_hints:
      - Use firecrawl.agent only when simpler firecrawl.scrape or firecrawl.extract have failed or are clearly insufficient for the task.
      - Best for complex extractions that require autonomous multi-page navigation, site interaction, or when you do not have the right seed URLs.
      - Do not default to this mode; prefer firecrawl.scrape for single-page reads and firecrawl.extract for known-URL structured extraction first.

  - name: firecrawl.recall_session
    description: Recall previous Firecrawl work stored in the agent session ledger.
    input_schema: schemas/intents/firecrawl.recall_session.input.json
    output_schema: schemas/intents/firecrawl.recall_session.output.json
    timeout_sec: 30

  - name: firecrawl.search
    description: Search the live web (web/news/images) and, by adding the 'alexandria' source, discover matching Alexandria catalogue tools for free in the same call. Alexandria is Firecrawl's knowledge library of 100+ official data providers plus research, developer, and government indexes; discovered tools carry provider/capability ids that firecrawl.alexandria executes. tool_detail:'full' returns each tool's input contract (options/response/examples) so the call can be built without another lookup.
    input_schema: schemas/intents/firecrawl.search.input.json
    output_schema: schemas/intents/firecrawl.search.output.json
    timeout_sec: 90
    usage_hints:
      - Use this when the orchestrator needs search results (not just one known URL) — plain link discovery, news recency, image lookup, or vertical searches via categories (developer/research/gov/pdf; gov cannot combine with others).
      - Discovery of Alexandria tools is always free and never counted in credits_used. Add sources:['alexandria'] whenever the goal touches an official data source (SEC filings, research papers, laws and regulations, package or product documentation) — a matching provider tool usually beats scraping HTML.
      - Call with tool_detail:'full' before executing anything: the tool entry then includes its options contract, so firecrawl.alexandria can be called correctly the first time.
      - tbs accepts qdr:h/d/w/m/y for recency windows, custom cdr:1,cd_min=...,cd_max=... ranges, and sbd:1 for sort-by-date.
      - include_domains and exclude_domains are mutually exclusive.

  - name: firecrawl.alexandria
    description: Execute an Alexandria catalogue tool discovered via firecrawl.search — pass its provider and capability ids plus an options object matching the tool's contract, and get typed, sourced records back (exact figures, timestamps, provenance) instead of scraped HTML. Execution is paid at the tool's listed price and counted against a per-task credit cap; each result reports its cost and the running task spend.
    input_schema: schemas/intents/firecrawl.alexandria.input.json
    output_schema: schemas/intents/firecrawl.alexandria.output.json
    timeout_sec: 120
    usage_hints:
      - Contract-first workflow — discover with firecrawl.search (sources:['alexandria'], tool_detail:'full'), then send exactly the options the contract declares. An invalid_option per-result error lists the valid option names, so one self-correcting retry is expected; guessing a second time is not.
      - Check the per-result provider_error and success flag on every call — the HTTP call can succeed while the tool result failed.
      - requires_action_url on a THIRD_PARTY_DATA_TERMS_REQUIRED provider_error means the user must accept that provider's data terms; surface the URL to the user and stop retrying. The call cannot authorize acceptance itself.
      - When the result reports budget_exceeded (or a BUDGET_EXCEEDED error), the task's Alexandria credit cap is spent — finish with the data already gathered instead of more tool calls.
      - Prefer providers whose records answer the question directly (e.g. firecrawl-research-index paper search is free); fall back to firecrawl.scrape or firecrawl.search web results when no catalogue tool fits.

artifact_types:
  - web_page
  - structured_extract
  - raw_json

policies:
  network_access: true
  writable_paths:
    - runs/artifacts
    - agents/firecrawl_web_scrape/store
    - agents/firecrawl_web_scrape/runtime
  tool_access: []
  allowed_senders:
    - cosmic/orchestrator:1.0.0
  intent_authorization:
    firecrawl.scrape: [cosmic/orchestrator:1.0.0]
    firecrawl.extract: [cosmic/orchestrator:1.0.0]
    firecrawl.agent: [cosmic/orchestrator:1.0.0]
    firecrawl.recall_session: [cosmic/orchestrator:1.0.0]
    firecrawl.search: [cosmic/orchestrator:1.0.0]
    firecrawl.alexandria: [cosmic/orchestrator:1.0.0]

sla:
  max_concurrency: 2
  heartbeat_interval_sec: 10
  heartbeat_ttl_sec: 30
  max_task_duration_sec: 300
  health_endpoint: /health
  retry_policy:
    max_attempts: 3
    backoff: exponential
    backoff_base_sec: 2
    backoff_max_sec: 60
    retryable_codes:
      - TIMEOUT
      - NETWORK_ERROR
      - RATE_LIMITED
    non_retryable_codes:
      - INVALID_INPUT
      - AUTH_ERROR
      - SCHEMA_VIOLATION
      - INTERNAL_ERROR
      - BUDGET_EXCEEDED

stream_key: streams:cosmic/firecrawl-web-scrape-agent:1.0.0

version_info:
  semver: 1.0.0
  released_at: 2026-03-16
  deprecated_at: null
  remove_after: null
  changelog: CHANGELOG.md
