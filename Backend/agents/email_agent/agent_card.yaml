agent_id: cosmic/email-agent:1.0.0
display_name: Agent Email
description: >
  Specialist agent for anything involving email threads, drafting, replying,
  searching, and sending through Cosmic Mail. Use it when the request is about
  reading or composing email, and pass a compact context brief or draft seed
  rather than a raw long transcript.

intents:
  - name: email.process_inbound
    description: Process an inbound email thread, summarize it, fetch attachment metadata/files into the agent artifact area, auto-parse supported document attachments through the docs specialist when possible, and apply standing instructions when configured.
    input_schema: schemas/intents/email.process_inbound.input.json
    output_schema: schemas/intents/email.process_inbound.output.json
    timeout_sec: 300
    usage_hints:
      - Use this when a real inbound email arrives and the system needs email-native understanding, not just transport delivery.
      - Keep attachments inside the email agent workflow unless another specialist explicitly needs them later.

  - name: email.handle
    description: Canonical email handling entrypoint for searching, summarizing, drafting, replying to, or sending email from a compact brief while the specialist normalizes one execution plan internally.
    input_schema: schemas/intents/email.handle.input.json
    output_schema: schemas/intents/email.handle.output.json
    timeout_sec: 240
    usage_hints:
      - Use this specialist for almost anything involving reading, understanding, drafting, replying to, or sending email.
      - Pass a compact context_brief and optional draft_seed; do not pass a long raw conversation transcript.
      - If a prior run already produced a draft_id and the next step is to send that same draft, pass the draft_id back so the specialist can continue directly instead of recomposing.
      - When sending a previously produced file from desktop, cron, heartbeat, or an event automation, resolve it first and pass its artifact_id via delegate_to_agent artifact_ids so it arrives here as TaskEnvelope.input_artifacts. On an `agent-email:` reply to the person who wrote that email, do not do this; `artifact_redeliver` puts the file on the gateway reply.
      - For attachment-specific requests in an email thread, use this to resolve the correct attachment and cached docs bundle first; then continue with the normal docs tools for actual document reading.
      - For new outbound drafts, attached_input_artifact_count is the attachment upload signal; resolved_attachment is only for resolving thread attachments.
      - Any email COSMIC itself is sending to the user — notification, alert, digest, heads-up, follow-up, or a plain "email me X" — goes out from COSMIC's own mailbox through this intent, whatever channel the request arrived on. Do not hand that to the Gmail specialist. Gmail is the user's own account, meant for their correspondence with other people.
      - "Do not call this specialist with send true when the current turn is already being delivered to the user over an `agent-email:` channel and the recipient is the person who wrote that email. There the response itself is the email, so a send is refused. Search and read on that channel are fine. That exception is about channel delivery only; on desktop, cron, heartbeat, and event-automation turns this specialist is exactly how COSMIC mails the user."
      - Cosmic Mail enforces a per-agent approval gate when an outbound mailbox's agent has approval_required enabled. A response with queued_for_approval=true (equivalently delivery_status="queued_for_approval" or a non-null approval_id) means the draft was successfully handed off to a human reviewer — this is a successful outcome, not a stall or failure. Treat the intent as complete, surface the approval_id and the queued status to the user, and do not retry or recompose the draft.
      - The user maintains a trusted-senders allowlist (managed in Spaces > Agent Email > Settings) that is mirrored into Cosmic Mail. Outbound to addresses on that list bypasses the approval gate, so the same agent may return sent=true for a trusted recipient and queued_for_approval=true for an untrusted recipient on the same draft path; this is expected and per-recipient.

  - name: email.send
    description: "Mechanically send an email from COSMIC's own mailbox — either deliver an existing draft by draft_id, or create and send with fully structured to_recipients, subject, and body. No goal parsing and no interpretation: every field is explicit."
    input_schema: schemas/intents/email.send.input.json
    output_schema: schemas/intents/email.send.output.json
    timeout_sec: 120
    usage_hints:
      - "Preferred for notifications, alerts, progress updates, and any 'email me X' where COSMIC is the author and the user is the recipient, on desktop, cron, heartbeat, or an event automation. Pass to_recipients (the user's address), subject, and body explicitly. This intent cannot attach files."
      - "Do not use this to reply on a turn that arrived on an `agent-email:` channel. That reply is already sent by the gateway, and a send to the person who wrote it is refused. This is not a failed delivery: do not retry it. A prior file for that reply goes through artifact_redeliver."
      - "Pass draft_id to deliver an existing draft; the draft is sent as-is, never recomposed."
      - "A send request that ends without confirmed delivery returns failed (EMAIL_SEND_NOT_COMPLETED) — retry the same structured call; do not switch to a prose email.handle goal. A refusal with code AGENT_EMAIL_REPLY_IS_THE_EMAIL is not that failure."
      - "Do not hand COSMIC-authored mail to the Gmail specialist; Gmail is the user's own account for their correspondence with other people."
  - name: email.reason
    description: Legacy alias for `email.handle`. Prefer `email.handle` for new work.
    input_schema: schemas/intents/email.reason.input.json
    output_schema: schemas/intents/email.reason.output.json
    timeout_sec: 240
    usage_hints:
      - Backward-compatible alias only. New orchestration should prefer `email.handle`.

  - name: email.manage_instruction
    description: Create, list, enable, disable, or remove standing email instructions that the email specialist may use on inbound mail.
    input_schema: schemas/intents/email.manage_instruction.input.json
    output_schema: schemas/intents/email.manage_instruction.output.json
    timeout_sec: 45
    usage_hints:
      - Use this to manage standing email rules and auto-reply policies, not to send a one-off message.
      - Natural-language rules like "watch for Arun" or "tell me if anything mentions Q3" belong here; the email specialist should own them durably instead of Opus trying to remember them.

  - name: email.recall_session
    description: Recall prior email-agent runs from the private session ledger.
    input_schema: schemas/intents/email.recall_session.input.json
    output_schema: schemas/intents/email.recall_session.output.json
    timeout_sec: 30
    usage_hints:
      - Recall prior email runs when you need exact reuse of earlier email-agent work instead of recomputing it.

artifact_types:
  - email_thread_snapshot
  - email_attachment
  - email_draft
  - email_send_result
  - email_summary

policies:
  network_access: true
  writable_paths:
    - runs/artifacts
    - agents/email_agent/store
    - agents/email_agent/runtime
  tool_access: []
  allowed_senders:
    - cosmic/gateway:1.0.0
    - cosmic/orchestrator:1.0.0
  intent_authorization:
    email.process_inbound: [cosmic/gateway:1.0.0, cosmic/orchestrator:1.0.0]
    email.handle: [cosmic/orchestrator:1.0.0]
    email.reason: [cosmic/orchestrator:1.0.0]
    email.manage_instruction: [cosmic/gateway:1.0.0, cosmic/orchestrator:1.0.0]
    email.recall_session: [cosmic/orchestrator:1.0.0]

sla:
  max_concurrency: 2
  heartbeat_interval_sec: 10
  heartbeat_ttl_sec: 30
  max_task_duration_sec: 300
  health_endpoint: /health
  retry_policy:
    max_attempts: 3
    backoff: exponential
    backoff_base_sec: 2
    backoff_max_sec: 60
    retryable_codes:
      - TIMEOUT
      - NETWORK_ERROR
      - RATE_LIMITED
    non_retryable_codes:
      - INVALID_INPUT
      - AUTH_ERROR
      - SCHEMA_VIOLATION
      - INTERNAL_ERROR

stream_key: streams:cosmic/email-agent:1.0.0

version_info:
  semver: 1.0.0
  released_at: 2026-03-25
  deprecated_at: null
  remove_after: null
  changelog: CHANGELOG.md
